name: SiCa Publisher

on:
  schedule:
    - cron: "*/30 * * * *"   # a cada 30 minutos (horario UTC; nao importa, o script checa a hora)
  workflow_dispatch: {}       # permite rodar manualmente (o Cloudflare tambem dispara na hora certa)

concurrency:                  # nunca duas publicacoes ao mesmo tempo (evita post duplicado)
  group: sica-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Levar datas do calendario para a Fila
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python sync_calendario.py
      - name: Publicar posts aprovados
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          SICA_LIVE: "1"
        run: python publisher.py --live
